[General]
__userfile__=true

[panel1]
# No background-color/font-color here on purpose: the LXQt theme (kde-plasma)
# provides them, so the panel matches the rest of the desktop.
alignment=-1
animation-duration=0
desktop=0
hidable=false
iconSize=22
lineCount=1
lockPanel=false
panelSize=32
plugins=mainmenu, quicklaunch, desktopswitch, taskbar, tray, statusnotifier, mount, volume, clock, showdesktop
position=Bottom
width=100
width-percent=true

[mainmenu]
type=mainmenu
alignment=Left
icon=MENUICON
showText=false

[quicklaunch]
type=quicklaunch
alignment=Left

[desktopswitch]
type=desktopswitch
alignment=Left

[taskbar]
type=taskbar
alignment=Left

[tray]
type=tray
alignment=Right

[statusnotifier]
type=statusnotifier
alignment=Right

[mount]
type=mount
alignment=Right

[volume]
type=volume
alignment=Right

[clock]
type=clock
alignment=Right

[showdesktop]
type=showdesktop
alignment=Right
