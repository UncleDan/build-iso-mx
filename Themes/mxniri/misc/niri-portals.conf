# MX niri flavour: override of /usr/share/xdg-desktop-portal/niri-portals.conf
#
# Same as upstream, except that file chooser dialogs use the GTK portal:
# xdg-desktop-portal-gnome would otherwise require nautilus for them.
[preferred]
default=gnome;gtk;
org.freedesktop.impl.portal.Access=gtk;
org.freedesktop.impl.portal.Notification=gtk;
org.freedesktop.impl.portal.Secret=gnome-keyring;
org.freedesktop.impl.portal.FileChooser=gtk;
